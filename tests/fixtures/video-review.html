<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Référence vidéo — intégration des vêtements</title><style>body{margin:0;background:#241b30;color:white;font:14px sans-serif}nav{padding:8px;display:flex;gap:10px;align-items:center}button{padding:8px}video{display:block;max-width:100%;height:calc(100vh - 55px);margin:auto}</style></head><body><nav><span id="info">Chargement…</span><button data-jump="0">Début</button><button data-jump=".2">20 %</button><button data-jump=".4">40 %</button><button data-jump=".6">60 %</button><button data-jump=".8">80 %</button><button data-jump=".95">Fin</button><button id="play">Lecture / pause</button></nav><video controls preload="auto" src="/.data/references/fitting-reference.mp4"></video><script>const video=document.querySelector('video');function info(){document.querySelector('#info').textContent=`${video.currentTime.toFixed(1)} / ${video.duration.toFixed(1)} s · ${video.videoWidth} × ${video.videoHeight}`};video.addEventListener('loadedmetadata',info);video.addEventListener('seeked',info);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{video.pause();video.currentTime=video.duration*Number(b.dataset.jump)});document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();</script></body></html>
