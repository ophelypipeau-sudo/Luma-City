<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sons du jeu · Luma City</title>
    <style>
      :root { --bg: #f4eefb; --card: #fff; --ink: #2d2140; --muted: #7a6c8f; --accent: #8b5cf6; --accent-soft: #ede4fe; --line: #e4d9f3; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .intro { color: var(--muted); margin: 0 0 20px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      button.sound { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; font: inherit; color: inherit; cursor: pointer; }
      button.sound:hover, button.sound.playing { border-color: var(--accent); background: var(--accent-soft); }
      .icon { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 13px; }
      .sound strong { display: block; }
      .sound span { color: var(--muted); font-size: 14px; }
      #all { border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 10px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sons du jeu</h1>
      <p class="intro">Les sons du jeu, avec les volumes réglés dans Paramètres → Sons.</p>
      <button id="all" type="button">▶ Tout écouter à la suite</button>
      <div id="list"></div>
    </main>
    <script type="module">
      import { SOUND_GROUPS, SOUND_NAMES, playSound, soundInfo } from "/apps/web/src/sounds.ts";
      const list = document.getElementById("list");
      const buttons = [];
      for (const group of SOUND_GROUPS) {
        const h2 = document.createElement("h2");
        h2.textContent = group;
        const ul = document.createElement("ul");
        for (const name of SOUND_NAMES.filter((sound) => soundInfo(sound).group === group)) {
          const { label, hint } = soundInfo(name);
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "sound";
          button.innerHTML = `<span class="icon">▶</span><div><strong></strong><span></span></div>`;
          button.querySelector("strong").textContent = label;
          button.querySelector("div span").textContent = hint;
          button.onclick = () => flash(button, name);
          buttons.push([button, name]);
          li.append(button);
          ul.append(li);
        }
        list.append(h2, ul);
      }
      function flash(button, name) {
        playSound(name, { preview: true });
        button.classList.add("playing");
        setTimeout(() => button.classList.remove("playing"), 700);
      }
      document.getElementById("all").onclick = async () => {
        for (const [button, name] of buttons) {
          flash(button, name);
          await new Promise((resolve) => setTimeout(resolve, ["niveau", "gain", "fin-de-partie"].includes(name) ? 2200 : 1100));
        }
      };
    </script>
  </body>
</html>
